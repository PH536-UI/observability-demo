apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-demo
  labels:
    app: observability-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: observability-demo
  template:
    metadata:
      labels:
        app: observability-demo
    spec:
      containers:
        - name: observability-demo
          image: observability-demo:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
