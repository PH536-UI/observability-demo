apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-demo
  namespace: app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: observability-demo

  template:
    metadata:
      labels:
        app: observability-demo

    spec:
      containers:

      - name: app

        image: observability-demo:v1

        imagePullPolicy: Never

        ports:
        - containerPort: 8000
